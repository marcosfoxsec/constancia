<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Constância — direção 3, Biscoito</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400;1,700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --barro: #1a1613;
        --face: #262019;
        --face-alta: #2f2820;
        --osso: #f2ece1;
        --ocre: #c98b3a;
        --texto: #ece5da;
        --texto-2: #9a8f81;
        --linha: #322a22;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--barro);
        color: var(--texto);
        font-family: 'Atkinson Hyperlegible', system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .app {
        max-width: 480px;
        margin: 0 auto;
        padding: 22px 16px 32px;
      }

      .topo {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        padding-bottom: 14px;
        border-bottom: 1px solid var(--linha);
      }
      h1 {
        font-size: 16px;
        font-weight: 400;
        margin: 0;
        color: var(--texto-2);
      }
      h1 b {
        color: var(--texto);
        font-weight: 700;
      }
      .contagem {
        font-size: 15px;
        color: var(--texto-2);
      }
      .contagem b {
        font-size: 44px;
        color: var(--osso);
        letter-spacing: -0.02em;
      }

      /* Os quatro ladrilhos do dia */
      .dia {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        margin: 16px 0 0;
      }
      .ladrilho-hoje {
        position: relative;
        aspect-ratio: 1;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        gap: 6px;
        padding: 14px;
        border: 0;
        border-radius: 3px;
        background: var(--face);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.055),
          inset 0 0 0 1px rgba(0, 0, 0, 0.35),
          0 2px 0 rgba(0, 0, 0, 0.45);
        color: var(--texto);
        font: inherit;
        text-align: left;
        cursor: pointer;
      }
      .ladrilho-hoje::after {
        content: '';
        position: absolute;
        inset: 8px 8px auto auto;
        width: 9px;
        height: 9px;
        border: 2px solid var(--ocre);
        border-radius: 50%;
      }
      .ladrilho-hoje[aria-pressed='true'] {
        background: var(--osso);
        color: #1a1613;
        box-shadow:
          inset 0 -2px 0 rgba(0, 0, 0, 0.14),
          0 2px 0 rgba(0, 0, 0, 0.45);
        animation: assentar 300ms cubic-bezier(0.2, 0.9, 0.3, 1.15);
      }
      .ladrilho-hoje[aria-pressed='true']::after {
        background: #1a1613;
        border-color: #1a1613;
      }
      @keyframes assentar {
        0% {
          transform: translateY(-6px);
        }
        60% {
          transform: translateY(1px);
        }
        100% {
          transform: none;
        }
      }
      .ladrilho-hoje .nome {
        font-size: 19px;
        font-weight: 700;
        line-height: 1.15;
      }
      .ladrilho-hoje .gatilho {
        font-size: 13px;
        color: var(--texto-2);
        line-height: 1.3;
      }
      .ladrilho-hoje[aria-pressed='true'] .gatilho {
        color: #6b5f4f;
      }
      .ladrilho-hoje .seq {
        font-size: 12px;
        color: var(--texto-2);
        border-top: 1px solid var(--linha);
        padding-top: 7px;
      }
      .ladrilho-hoje[aria-pressed='true'] .seq {
        color: #6b5f4f;
        border-color: rgba(0, 0, 0, 0.12);
      }
      .ladrilho-hoje:focus-visible {
        outline: 2px solid var(--ocre);
        outline-offset: 3px;
      }

      .recado {
        margin: 14px 0 0;
        font-size: 14px;
        line-height: 1.45;
        color: var(--texto-2);
      }
      .recado b {
        color: var(--texto);
        font-weight: 400;
      }

      /* Faixa: oito semanas em fiada alternada */
      .faixa {
        margin-top: 16px;
        padding-top: 14px;
        border-top: 1px solid var(--linha);
      }
      .faixa h2 {
        font-size: 13px;
        font-weight: 400;
        color: var(--texto-2);
        margin: 0 0 8px;
      }
      .semana {
        display: flex;
        gap: 3px;
        margin-bottom: 3px;
      }
      .semana:nth-child(even) {
        padding-left: 14px;
        padding-right: 0;
      }
      .semana:nth-child(odd) {
        padding-right: 14px;
      }
      .mini {
        flex: 1;
        height: 20px;
        border-radius: 1px;
        background: linear-gradient(
          to top,
          var(--osso) 0 var(--f, 0%),
          var(--face-alta) var(--f, 0%) 100%
        );
        box-shadow:
          inset 0 0 0 1px rgba(0, 0, 0, 0.45),
          inset 0 0 0 2px rgba(255, 255, 255, 0.03);
      }
      .mini.futuro {
        background: none;
        box-shadow: inset 0 0 0 1px var(--linha);
      }
      .mini.hoje {
        box-shadow:
          inset 0 0 0 1px rgba(0, 0, 0, 0.4),
          0 0 0 2px var(--ocre);
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          animation: none !important;
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="app">
      <div class="topo">
        <h1><b>Segunda</b>, 14 de setembro</h1>
        <div class="contagem"><b>1</b> de 4</div>
      </div>

      <section class="dia" aria-label="Hábitos de hoje">
        <button class="ladrilho-hoje" aria-pressed="true">
          <span class="nome">Ler 10 páginas</span>
          <span class="gatilho">depois do café</span>
          <span class="seq">18 dias</span>
        </button>
        <button class="ladrilho-hoje" aria-pressed="false">
          <span class="nome">Caminhar 30 minutos</span>
          <span class="gatilho">quando o sol baixar</span>
          <span class="seq">6 dias</span>
        </button>
        <button class="ladrilho-hoje" aria-pressed="false">
          <span class="nome">Alongar a lombar</span>
          <span class="gatilho">antes do banho · mínimo 2 min</span>
          <span class="seq">31 dias</span>
        </button>
        <button class="ladrilho-hoje" aria-pressed="false">
          <span class="nome">Violão, 10 minutos</span>
          <span class="gatilho">depois do jantar</span>
          <span class="seq">4 dias</span>
        </button>
      </section>

      <p class="recado"><b>Ontem ficou aberto.</b> Um dia não desfaz o mês.</p>

      <section class="faixa" aria-label="Últimas oito semanas">
        <h2>43 dias assentados nas últimas oito semanas</h2>
        <div id="faixa"></div>
      </section>
    </main>

    <script>
      const niveis = [
        3, 4, 4, 0, 3, 4, 2, 4, 4, 3, 4, 4, 0, 3, 4, 3, 4, 4, 4, 2, 4, 0, 4, 4, 3, 4, 4, 1, 4, 4, 4,
        0, 3, 4, 4, 4, 2, 4, 4, 4, 3, 1, 3, 4, 4, 4, 0, 4, 0,
      ]
      const rotulos = [
        'nenhum hábito',
        'um hábito',
        'dois hábitos',
        'três hábitos',
        'quatro hábitos',
      ]
      const faixa = document.getElementById('faixa')
      // O nível vira altura de preenchimento: sem matiz, legível em qualquer daltonismo.
      for (let s = 0; s < 8; s++) {
        const linha = document.createElement('div')
        linha.className = 'semana'
        for (let d = 0; d < 7; d++) {
          const i = s * 7 + d
          const m = document.createElement('div')
          m.className = 'mini'
          m.setAttribute('role', 'img')
          if (i < niveis.length) {
            m.style.setProperty('--f', (niveis[i] / 4) * 100 + '%')
            m.setAttribute('aria-label', `dia ${i + 1}: ${rotulos[niveis[i]]}`)
          } else if (i === niveis.length) {
            m.classList.add('hoje')
            m.style.setProperty('--f', '25%')
            m.setAttribute('aria-label', 'hoje: um hábito de quatro')
          } else {
            m.classList.add('futuro')
            m.setAttribute('aria-label', 'dia futuro')
          }
          linha.appendChild(m)
        }
        faixa.appendChild(linha)
      }
      document
        .querySelectorAll('.ladrilho-hoje')
        .forEach((b) =>
          b.addEventListener('click', () =>
            b.setAttribute(
              'aria-pressed',
              b.getAttribute('aria-pressed') === 'true' ? 'false' : 'true',
            ),
          ),
        )
    </script>
  </body>
</html>
